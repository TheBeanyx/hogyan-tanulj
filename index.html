<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulásmódszertan Tréning - Start</title>
    <style>
        :root { 
            --p: #3498db; 
            --s: #2ecc71; 
            --dark: #0f172a;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--dark); 
            color: white;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            background: white; 
            color: #333;
            width: 100%; 
            max-width: 600px; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
        }

        .icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 35px;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }

        .info-card h4 {
            margin: 0 0 5px 0;
            color: var(--p);
        }

        .info-card p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }
        
        button { 
            background: var(--s); 
            color: white; 
            border: none; 
            padding: 18px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: bold;
            width: 100%; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        button:hover {
            background: #27ae60;
        }

        button:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">💡</div>
    <h1>Hatékony Tanulás</h1>
    <div class="subtitle">Interaktív Módszertani Tréning</div>
    
    <p>Üdvözlünk! Egyetlen izgalmas feladatod lessz! Szabadulj Ki! SOK SIKERT!</p>
    

    <button onclick="window.location.href='tanulas_modszertan1.html'">Tréning indítása</button>
</div>

</body>
</html>
